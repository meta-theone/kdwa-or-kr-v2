<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>복지회 새 홈페이지 시안</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: 파란 상단 영역 + 흰 카드 본문. 데스크톱은 상단 메뉴(마우스 올리면 하위 메뉴), 모바일은 하단 탭.
   지부장 화면은 왼쪽 메뉴 + 본문. 색은 로고의 남색과 2026 포스터의 로열블루·주황. 주황은 행동 버튼에만. */
:root{
 --bg:#f2f5fb; --surface:#ffffff; --ink:#0f1c33; --mut:#4d5c76; --line:#d8e0ee;
 --brand:#1456c8; --brand-deep:#0b2f78; --brand-soft:#e6eefc;
 --accent:#f08a00; --accent-ink:#2a1700; --green:#1d8a5b; --green-soft:#e1f4ea; --red:#c2362b; --red-soft:#fde8e6;
 --on-brand:#ffffff; --t1:#dbe6fa; --t2:#a9c3f2; --t3:#1456c8; --t4:#f08a00;
 --shadow:0 1px 2px rgba(15,28,51,.06),0 8px 24px rgba(15,28,51,.07);
 --fs:17px; --disp:"Black Han Sans","Noto Sans KR","Malgun Gothic",sans-serif; --body:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#0a111e; --surface:#121c2e; --ink:#eaf0fb; --mut:#a2b0c8; --line:#25324a;
 --brand:#6ea8ff; --brand-deep:#0a1f4d; --brand-soft:#16294d;
 --accent:#ffb04d; --accent-ink:#241400; --green:#5cc79a; --green-soft:#143528; --red:#ff8d82; --red-soft:#3b1a17;
 --on-brand:#07142e; --t1:#1a2c4d; --t2:#2b4a86; --t3:#6ea8ff; --t4:#ffb04d;
 --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#0a111e; --surface:#121c2e; --ink:#eaf0fb; --mut:#a2b0c8; --line:#25324a;
 --brand:#6ea8ff; --brand-deep:#0a1f4d; --brand-soft:#16294d;
 --accent:#ffb04d; --accent-ink:#241400; --green:#5cc79a; --green-soft:#143528; --red:#ff8d82; --red-soft:#3b1a17;
 --on-brand:#07142e; --t1:#1a2c4d; --t2:#2b4a86; --t3:#6ea8ff; --t4:#ffb04d;
 --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.65;padding-bottom:84px;-webkit-text-size-adjust:100%;word-break:keep-all;overflow-wrap:break-word}
a{color:inherit}button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.skip{position:absolute;left:-999px;top:8px;background:var(--accent);color:var(--accent-ink);padding:10px 14px;border-radius:8px;z-index:100}.skip:focus{left:8px}
.wrap{width:min(1120px,100%);margin-inline:auto;padding-inline:16px}
.ribbon{background:var(--brand-deep);color:#dbe7ff;font-size:.78rem;padding:6px 0}
.ribbon .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.ribbon b{color:#ffd28a}
.tools{display:flex;gap:6px}.tools button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:8px;min-width:40px;min-height:34px;cursor:pointer;padding:0 10px}
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
header.top .wrap{display:flex;align-items:center;gap:16px;min-height:68px}
.logo{display:flex;align-items:center;text-decoration:none;flex:0 0 auto}
.logo img{height:44px;width:auto;display:block;border-radius:6px;background:#fff}
nav.main{display:none;margin-left:auto;gap:2px}
nav.main>div{position:relative}
nav.main>div>a{display:block;text-decoration:none;padding:12px 9px;border-radius:10px;font-weight:700;font-size:.9rem;white-space:nowrap}
nav.main>div:hover>a,nav.main>div:focus-within>a,nav.main>div>a[aria-current="page"]{background:var(--brand-soft);color:var(--brand)}
nav.main .drop{display:none;position:absolute;left:0;top:100%;min-width:190px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;z-index:40}
nav.main>div:hover .drop,nav.main>div:focus-within .drop{display:block}
nav.main .drop a{display:block;padding:10px 12px;border-radius:8px;text-decoration:none;font-size:.9rem;white-space:nowrap}
nav.main .drop a:hover{background:var(--brand-soft);color:var(--brand)}
.who{display:none;align-items:center;gap:8px;white-space:nowrap;flex:0 0 auto}.who .nm{display:none}@media(min-width:1440px){.who .nm{display:inline}}
.menubtn{margin-left:auto;background:var(--brand);color:var(--on-brand);border:0;border-radius:10px;min-height:44px;padding:0 16px;font-weight:700;cursor:pointer}
@media(min-width:1000px){nav.main{display:flex}.menubtn{display:none}body{padding-bottom:0}.who{display:flex}}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:60;overflow:auto;padding:16px;display:none}
.sheet.open{display:block}
.sheet h2{font-family:var(--disp);font-weight:400;font-size:1.4rem;margin:0}
.sheet .x{float:right;background:var(--surface);border:1px solid var(--line);border-radius:10px;min-height:44px;min-width:44px;cursor:pointer}
.sheet details{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:10px 0;padding:4px 14px}
.sheet summary{font-weight:700;padding:12px 0;cursor:pointer}
.sheet details a{display:block;padding:12px 0;border-top:1px solid var(--line);text-decoration:none;color:var(--mut)}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;z-index:40;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar a{flex:1;text-align:center;text-decoration:none;padding:8px 2px;min-height:62px;color:var(--mut);font-size:.78rem;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabbar svg,.ico{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar a[aria-current="page"]{color:var(--brand);font-weight:700}
@media(min-width:1000px){.tabbar{display:none}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;min-height:48px;padding:0 20px;font-weight:700;cursor:pointer;text-decoration:none;background:var(--accent);color:var(--accent-ink)}
.btn:hover{filter:brightness(1.05)}.btn.line{background:transparent;color:var(--brand);box-shadow:inset 0 0 0 2px var(--brand)}
.btn.sm{min-height:40px;padding:0 14px;font-size:.88rem;border-radius:10px}
.btn.ok{background:var(--green);color:#fff}.btn.no{background:transparent;color:var(--red);box-shadow:inset 0 0 0 2px var(--red)}
.btn.plain{background:var(--bg);color:var(--ink)}
.btn.ghost{background:rgba(255,255,255,.14);color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.45)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.card.lift{box-shadow:var(--shadow);border-color:transparent}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--brand-soft);color:var(--brand);border-radius:999px;padding:3px 12px;font-size:.8rem;font-weight:700;white-space:nowrap}
.chip.g{background:var(--green-soft);color:var(--green)}.chip.o{background:#ffe9c9;color:#8a4a00}.chip.r{background:var(--red-soft);color:var(--red)}.chip.m{background:var(--bg);color:var(--mut)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.o{background:#3a2a10;color:#ffcb85}}
:root[data-theme="dark"] .chip.o{background:#3a2a10;color:#ffcb85}
h1,h2,h3{margin:0;text-wrap:balance}
.disp{font-family:var(--disp);font-weight:400;letter-spacing:-.01em}
.sec{padding-block:30px}.sec>.wrap>h2,.h2{font-family:var(--disp);font-weight:400;font-size:1.6rem;margin-bottom:6px}
.sub{color:var(--mut);margin:0 0 16px}
.mut{color:var(--mut)}.small{font-size:.86rem}.num{font-variant-numeric:tabular-nums}
.stack{display:grid;gap:14px;min-width:0;align-content:start}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hero{background:linear-gradient(135deg,var(--brand-deep) 0%,#1456c8 62%,#2a7be8 100%);color:#fff;padding-block:34px 44px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-90px;top:-90px;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(255,176,77,.35),rgba(255,176,77,0) 68%);pointer-events:none}
.hero .wrap{display:grid;gap:26px;position:relative;z-index:1}.hero .wrap>*{min-width:0}
.hero h1{font-family:var(--disp);font-weight:400;font-size:clamp(2rem,6.4vw,3.3rem);line-height:1.22}
.hero p.lead{font-size:1.06rem;opacity:.92;max-width:34em;margin:10px 0 0}
.finder{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);border-radius:16px;padding:14px;display:grid;gap:10px}
.finder label{font-weight:700;font-size:.9rem}.finder .r{display:flex;gap:8px;flex-wrap:wrap}
.finder select{flex:1 1 150px;min-height:50px;border-radius:12px;border:0;padding:0 12px;background:#fff;color:#0f1c33}
.hstats{display:flex;gap:22px;flex-wrap:wrap;margin-top:8px}.hstats div{display:flex;flex-direction:column}
.hstats b{font-family:var(--disp);font-weight:400;font-size:1.9rem;line-height:1.1}.hstats span{font-size:.8rem;opacity:.85}
@media(min-width:900px){.hero .wrap{grid-template-columns:1.25fr 1fr;align-items:center}.hero{padding-block:54px 60px}}
.pagehead{background:linear-gradient(135deg,var(--brand-deep),#1456c8);color:#fff;padding-block:26px}
.pagehead h1{font-family:var(--disp);font-weight:400;font-size:clamp(1.7rem,4.6vw,2.4rem)}
.crumbs{font-size:.85rem;opacity:.85;margin-bottom:4px}.crumbs a{color:#fff}
.subtabs{display:flex;gap:6px;overflow-x:auto;padding-block:14px 2px;scrollbar-width:thin}
.subtabs a,.subtabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;min-height:44px;padding:0 18px;font-weight:700;cursor:pointer;white-space:nowrap;color:var(--mut);text-decoration:none;display:inline-flex;align-items:center}
.subtabs [aria-current="page"],.subtabs [aria-selected="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.mapbox{display:grid;gap:18px}.mapbox>*{min-width:0}
@media(min-width:900px){.mapbox{grid-template-columns:1fr 1fr;align-items:start}}
.cart{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:420px}
.tile{aspect-ratio:1/.92;border-radius:14px;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-weight:700;line-height:1.2;color:var(--ink);background:var(--brand-soft);padding:2px}
.tile .n{font-size:.72rem;font-weight:500;color:var(--mut)}.tile.empty{visibility:hidden}
.tile.l1{background:var(--t1)}.tile.l2{background:var(--t2)}
.tile.l3{background:var(--t3);color:var(--on-brand)}.tile.l3 .n{color:var(--on-brand)}
.tile.l4{background:var(--t4);color:var(--accent-ink)}.tile.l4 .n{color:var(--accent-ink)}
.tile[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:2px}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px;font-size:.8rem;color:var(--mut)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:5px;vertical-align:-2px}
.blist{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.blist a{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-decoration:none}
.blist a:hover{border-color:var(--brand)}.blist .nm{font-weight:700}.blist .meta{font-size:.82rem;color:var(--mut)}
.evgrid{display:grid;gap:12px}.evgrid>*{min-width:0}
@media(min-width:700px){.evgrid{grid-template-columns:repeat(2,1fr)}}@media(min-width:1000px){.evgrid{grid-template-columns:repeat(3,1fr)}}
.ev{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:start;text-decoration:none}
.date{background:var(--brand);color:var(--on-brand);border-radius:12px;text-align:center;padding:8px 0;line-height:1.1}
.date b{display:block;font-family:var(--disp);font-weight:400;font-size:1.7rem}.date span{font-size:.72rem;opacity:.9}
.news{display:grid;gap:14px}.news>*{min-width:0}@media(min-width:900px){.news{grid-template-columns:1.2fr 1fr}}
.notice{background:linear-gradient(160deg,var(--brand-deep),#1456c8);color:#fff;border:0}
.notice h3{font-family:var(--disp);font-weight:400;font-size:1.5rem;line-height:1.3}
.price{display:flex;gap:14px;flex-wrap:wrap;margin:14px 0}.price div{background:rgba(255,255,255,.12);border-radius:12px;padding:10px 14px}
.price small{display:block;opacity:.85}.price b{font-family:var(--disp);font-weight:400;font-size:1.5rem}.price .hi b{color:#ffcb85}
.list{list-style:none;margin:0;padding:0}.list li{padding:12px 0;border-bottom:1px solid var(--line);display:flex;gap:12px;justify-content:space-between;align-items:center}
.list li:last-child{border:0}.list a{text-decoration:none;font-weight:500}.list a:hover{color:var(--brand);text-decoration:underline}
.src{color:var(--mut);font-size:.82rem;white-space:nowrap}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}@media(min-width:700px){.photos{grid-template-columns:repeat(5,1fr)}}
.ph{aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--brand-soft);position:relative;display:block}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .tag{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.55);color:#fff;font-size:.66rem;padding:1px 8px;border-radius:99px}
.cover{background:linear-gradient(135deg,var(--brand-deep),#1456c8);color:#fff;padding-block:30px}
.cover .wrap{display:grid;gap:16px}.cover h1{font-family:var(--disp);font-weight:400;font-size:clamp(1.9rem,5vw,2.8rem)}
.kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(min-width:700px){.kpi{grid-template-columns:repeat(4,1fr)}}
.kpi>div{background:rgba(255,255,255,.12);border-radius:14px;padding:12px 14px;min-width:0}
.kpi b{display:block;font-family:var(--disp);font-weight:400;font-size:1.7rem;line-height:1.1}.kpi span{font-size:.8rem;opacity:.88}
.biz{display:grid;gap:12px}@media(min-width:700px){.biz{grid-template-columns:repeat(2,1fr)}}@media(min-width:1000px){.biz{grid-template-columns:repeat(3,1fr)}}
.biz .card{display:grid;gap:8px;align-content:start}.biz .ic{width:46px;height:46px;border-radius:12px;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center}
.prose p{margin:.6em 0;max-width:46em}.prose h3{font-family:var(--disp);font-weight:400;font-size:1.25rem;margin-top:1.2em}
.prose ul{padding-left:1.2em;margin:.4em 0}.prose li{margin:.25em 0}
.tree{display:grid;gap:8px;margin-top:10px}.tree .n{border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--surface)}
.tree .n.hi{border-color:var(--brand);background:var(--brand-soft)}.tree .ind{margin-left:22px}
.form{display:grid;gap:12px}.form label{font-weight:700;font-size:.92rem;display:grid;gap:6px}
.form input[type=text],.form input[type=date],.form input[type=number],.form input[type=password],.form select,.form textarea{min-height:48px;border-radius:12px;border:1.5px solid var(--line);padding:10px 14px;background:var(--surface);width:100%}
.form textarea{min-height:110px;resize:vertical}.form input:focus,.form textarea:focus,.form select:focus{border-color:var(--brand)}
.consent{display:flex;gap:12px;align-items:flex-start;background:#fff4e0;border:1.5px solid #f0c27a;border-radius:12px;padding:12px 14px;color:#4a2c00}
.consent input{width:24px;height:24px;margin-top:2px;flex:0 0 auto;accent-color:var(--accent)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .consent{background:#2e220d;border-color:#6e5220;color:#ffdca3}}
:root[data-theme="dark"] .consent{background:#2e220d;border-color:#6e5220;color:#ffdca3}
.drop{border:2px dashed var(--brand);border-radius:14px;padding:18px;text-align:center;background:var(--brand-soft);cursor:pointer;display:block}
.drop input{display:none}.drop:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.drop svg{width:34px;height:34px;stroke:var(--brand);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block;margin:0 auto 6px}
.mshell{display:grid;gap:16px;padding-block:18px}.mshell>*{min-width:0}
@media(min-width:1000px){.mshell{grid-template-columns:236px 1fr;align-items:start}}
.side{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:none}
@media(min-width:1000px){.side{display:block;position:sticky;top:84px}}
.side .me{padding:6px 8px 12px;border-bottom:1px solid var(--line);margin-bottom:8px}
.side a{display:flex;align-items:center;gap:10px;padding:11px 10px;border-radius:10px;text-decoration:none;font-weight:500}
.side a:hover{background:var(--brand-soft)}.side a[aria-current="page"]{background:var(--brand);color:var(--on-brand);font-weight:700}
.side .ico{width:20px;height:20px}.side .cnt{margin-left:auto;background:var(--accent);color:var(--accent-ink);border-radius:99px;font-size:.72rem;font-weight:700;padding:0 8px}
.mchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}@media(min-width:1000px){.mchips{display:none}}
.mchips a{white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:999px;min-height:44px;padding:0 16px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:700;color:var(--mut)}
.mchips a[aria-current="page"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.mchips .cnt{background:var(--accent);color:var(--accent-ink);border-radius:99px;font-size:.72rem;padding:0 7px}
.mk{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(min-width:800px){.mk{grid-template-columns:repeat(4,1fr)}}
.mk>a,.mk>div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-decoration:none;display:block;min-width:0}
.mk b{display:block;font-family:var(--disp);font-weight:400;font-size:1.8rem;line-height:1.15}.mk span{font-size:.8rem;color:var(--mut)}
.two{display:grid;gap:14px;align-items:start}.two>*{min-width:0}@media(min-width:900px){.two{grid-template-columns:1.1fr 1fr}}
.todo{display:grid;gap:8px}.todo a{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--bg);text-decoration:none}
.todo a:hover{outline:2px solid var(--brand)}.todo b{flex:1}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:0 0 auto}
.ring{width:132px;height:132px;position:relative;flex:0 0 auto}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}

.srow{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .5s}
.badges{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:10px}
.bd{text-align:center;padding:12px 6px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface)}
.bd .ic{width:44px;height:44px;border-radius:50%;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;background:var(--line);color:var(--mut)}
.bd.on{border-color:var(--accent)}.bd.on .ic{background:var(--accent);color:var(--accent-ink)}
.bd small{display:block;color:var(--mut);font-size:.74rem;line-height:1.35}.bd b{font-size:.84rem}

.crumbs2{font-size:.82rem;color:var(--mut)}.crumbs2 a{color:var(--mut)}
.ccol .wrap{width:100%;padding-inline:0}.ccol .sec{padding-block:12px}

/* 홈 배너·목록 */
.banner{border-radius:16px;padding:26px 24px;background:linear-gradient(110deg,#0b2f78 0%,#1456c8 60%,#4a9bf0 100%);color:#fff;position:relative;overflow:hidden}

.gal{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding-top:10px}@media(min-width:700px){.gal{grid-template-columns:repeat(4,1fr)}}

/* ===== v5: 포털형 정돈 + 조직 관리 기능 스타일 ===== */
:root{--bg:#f4f6fa;--line:#e4e9f1;--mut:#5a677c;--shadow-sm:0 1px 2px rgba(16,28,52,.05);--shadow:0 1px 2px rgba(16,28,52,.05),0 10px 30px rgba(16,28,52,.08);--r:16px;--disp:"Noto Sans KR","Malgun Gothic",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b121f;--line:#243148;--mut:#a6b3c9}}
:root[data-theme="dark"]{--bg:#0b121f;--line:#243148;--mut:#a6b3c9}
body{letter-spacing:-.005em}
.disp,.ptitle h1,.banner h2,.sheet h2,.modal h3,.sec>.wrap>h2,.h2,.notice h3,.price b,.hstats b,.kpi b,.mk b,.ring .c b,.date b,.rank .no,.cover h1,.hero h1{font-family:var(--disp)!important;font-weight:800!important;letter-spacing:-.025em}
.card,.coops,.cal,.find,.lbox{border-radius:var(--r);box-shadow:var(--shadow-sm)}
.card.lift{box-shadow:var(--shadow)}
/* 헤더: 가운데 큰 검색창 (포털형) */
header.top{background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px)}
header.top .wrap.hd{grid-template-columns:auto minmax(240px,560px) 1fr;grid-template-areas:"logo search util";gap:10px 24px;padding-block:12px}
.hr{display:contents}
.logo{grid-area:logo}
.hr .search{grid-area:search;width:100%;position:relative}
.hr .util{grid-area:util;justify-content:flex-end}
@media(max-width:999px){header.top .wrap.hd{grid-template-columns:1fr auto;grid-template-areas:"logo btn"}.hr{display:none}}
.search input{flex:1;min-width:0;width:100%;border-radius:999px;padding:0 18px;min-height:44px;background:var(--bg);border-color:transparent}
.search input:focus{background:var(--surface);border-color:var(--brand)}
.search button{border-radius:999px;min-height:44px;padding:0 20px}
.kbd{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:0 6px;background:var(--surface)}
.util .adm{background:var(--brand);color:var(--on-brand)!important;border-radius:999px;padding:6px 14px!important;font-weight:700;text-decoration:none!important}
/* 왼쪽 메뉴: 흰 카드, 열리면 브랜드색 */

.vmenu .gt{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow-sm);padding:14px 16px}
.vmenu .gt:hover{border-color:var(--brand);color:var(--brand)}
.vmenu .g.open .gt{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.vmenu ul{border-radius:14px;box-shadow:var(--shadow-sm)}
.lbox.login{background:var(--surface);border:1px solid var(--line)}
/* 구역 제목: 줄무늬 제거, 군더더기 없는 제목줄 */
.sech{background:none;border:0;padding:4px 2px 10px;border-radius:0}
.sech h2{font-size:1.15rem;font-weight:800;display:flex;align-items:center;gap:8px}
.sech h2::before{content:"";width:6px;height:18px;border-radius:3px;background:var(--brand)}

.blk{border-radius:var(--r);border:1px solid var(--line);padding:4px 18px 8px;box-shadow:var(--shadow-sm)}
.blk .list li{padding:11px 0}
.blk .list a{font-weight:500}

.whoW{position:relative;display:flex;align-items:center;gap:8px}

.cmdk li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 14px;border-radius:10px;cursor:pointer}

const SEGMSG={"회비 미납":(n)=>`[${n}] 올해 회비 납부 안내\n안녕하세요, ${n} 지부장입니다. 올해 회비가 아직 확인되지 않아 안내드립니다. 이미 납부하셨다면 이 문자는 무시해 주세요. 문의는 지부로 연락 주세요.`,"휴면":(n)=>`[${n}] 회원 정보 보관 안내\n오랫동안 이용 기록이 없어 회원 정보가 정리될 예정입니다. 계속 활동을 원하시면 지부로 연락 주세요.`,"최근 가입":(n)=>`[${n}] 가입을 환영합니다\n함께하게 되어 반갑습니다. 지부 행사와 소식은 홈페이지에서 확인하실 수 있습니다.`};
/* 문의 답변 초안 */
function aiDraft(q,b){const nm=br(b).nm,t=q.sub+" "+q.body;const open=`안녕하세요, ${nm}입니다. 문의해 주셔서 감사합니다.\n\n`,close=`\n\n더 궁금한 점은 언제든 말씀해 주세요.`;
 if(/가입|서류|신청/.test(t))return open+"가입은 가입신청서와 개인정보 동의서를 내시면 됩니다. 가족이 대신 신청하시려면 위임장이 필요합니다. 신청 후에는 지부, 시·도, 중앙 순서로 확인하며 결과는 연락처로 안내드립니다."+close;
 if(/휠체어|이동|행사|참석/.test(t))return open+"행사 참석과 이동 지원은 담당 간사가 가능 여부를 확인해 24시간 안에 다시 연락드리겠습니다. 필요한 지원(휠체어, 동행 등)을 알려 주시면 준비에 도움이 됩니다."+close;
 return open+"문의하신 내용을 확인했습니다. 담당자가 살펴본 뒤 24시간 안에 자세히 답변드리겠습니다."+close}
AFTER["m-inq"]=()=>{$$('form[data-form="reply"]').forEach(f=>{const s=f.querySelector("button[type=submit]");s.insertAdjacentHTML("beforebegin",`<button type="button" class="btn sm line" data-act="ai-draft" data-id="${f.dataset.id}" style="justify-self:start">AI 답변 초안 (시안)</button>`)})};
document.addEventListener("click",e=>{const t=e.target.closest("[data-act]");if(!t)return;const A=t.dataset.act,id=t.dataset.id;
 if(A==="slide"){SLIDE=t.dataset.i!==undefined?+t.dataset.i:(SLIDE+(+t.dataset.d)+SLIDES.length)%SLIDES.length;const h=$(".hero2");if(h)h.outerHTML=slidesHTML();return}
 if(A==="seg"){MF=({unpaid:"회비 미납",dormant:"휴면",new:"최근 가입",all:"전체"})[t.dataset.k];MP=1;renderMembers();return}
 if(A==="seg-send"){const L=memFiltered(),fn=SEGMSG[MF];if(!fn){toast("보낼 목록을 먼저 골라 주세요. 예: 회비 미납");return}const nm=br(SESS.bid).nm;
  openModal({title:`${MF} 회원 ${L.length}명에게 안내 보내기`,body:`<div class="form"><label for="sch">보내는 방법<select id="sch"><option>알림톡</option><option>문자</option></select></label><label for="smsg">보낼 글<textarea id="smsg" readonly style="min-height:130px">${esc(fn(nm))}</textarea></label></div><p class="small mut" style="margin:10px 0 0">보내면 활동 기록에 남습니다. 알림톡·문자는 비용이 듭니다(시안).</p>`,ok:"보내기",onOk:()=>{const ch=($("#sch")||{}).value||"알림톡";log(`회원 안내 발송: ${MF} ${L.length}명 (${ch})`);toast(`${L.length}명에게 보냈어요(시안)`)}});return}
 if(A==="ai-draft"){const q=inquiries(SESS.bid).find(x=>x.id===id),ta=$("#rp-"+id);if(q&&ta){ta.value=aiDraft(q,SESS.bid);toast("AI 초안을 넣었어요(시안). 내용을 확인하고 보내세요")}return}
 if(A==="app-ok"){const a=APPS.find(x=>x.id===id);if(a)pushNotif("region","2차 승인 대기",a.nm+"님 신청이 "+br(a.b).nm+"에서 올라왔습니다.",{go:"m-r2"});return}
 if(A==="r-ok"){const a=APPS.find(x=>x.id===id);if(a)pushNotif("central","가입 확정 대기",a.nm+"님 ("+br(a.b).nm+") 신청이 중앙 확정을 기다립니다.",{go:"c-approve"});return}});
document.addEventListener("submit",e=>{const f=e.target.closest('[data-form="join"]');if(f&&JOINED&&!JOINED.notified){JOINED.notified=true;pushNotif("branch","가입 신청이 접수되었어요",JOINED.n+"님이 가입을 신청했습니다.",{bid:JOINED.b,go:"m-apps"})}});

/* ===== v5d: 전국 현황 화면 균형 정돈 (왼쪽·오른쪽 두 열을 각각 쌓음) ===== */
function cDash(){const tot=BR.reduce((a,b)=>a+b.mem,0),act=BR.filter(b=>pts(b.id)>=90).length,actP=Math.round(act/BR.length*100);
 const pend=APPS.filter(a=>a.stage>=1&&a.stage<=3).length,inqOpen=BR.reduce((a,b)=>a+openInq(b.id),0),evM=EV.filter(e=>e.d.startsWith("2026-10")).length;
 const stg=[["접수",APPS.length],["지부 승인",APPS.filter(a=>a.stage>=2).length],["시·도 승인",APPS.filter(a=>a.stage>=3).length],["중앙 확정",APPS.filter(a=>a.stage>=4).length]],mx=Math.max(1,stg[0][1]);
 const lvl={},cn={};BR.forEach(b=>{lvl[b.s]=Math.max(lvl[b.s]||0,lv(pts(b.id)));cn[b.s]=(cn[b.s]||0)+1});
 let heat="";for(let yy=1;yy<=5;yy++)for(let xx=1;xx<=4;xx++){const t=SIDO.find(z=>z[1]===xx&&z[2]===yy);heat+=t?`<button class="h${lvl[t[0]]||0}" data-act="tree-s" data-sd="${t[0]}" aria-label="${t[0]} 지부 ${cn[t[0]]||0}곳, 활동 ${lvl[t[0]]||0}단계. 눌러서 조직 관리로 이동">${t[0]}<small>${cn[t[0]]?cn[t[0]]+"곳":"준비중"}</small></button>`:`<button class="hx" tabindex="-1" aria-hidden="true"></button>`}
 const warn=BR.map(b=>({b,why:[pts(b.id)<100?"활동 점수 "+pts(b.id)+"점":"",openApps(b.id)>=3?"가입 대기 "+openApps(b.id)+"건":"",openInq(b.id)>=2?"문의 "+openInq(b.id)+"건 대기":""].filter(Boolean)})).filter(x=>x.why.length).sort((a,c)=>pts(a.b.id)-pts(c.b.id)).slice(0,5);
 return shell("c-dash","전국 현황","시·도복지회와 지부의 활동, 승인 흐름, 주의가 필요한 곳을 한눈에 봅니다.",
 `<div class="mk"><a href="#c-tree"><b class="num">${tot.toLocaleString()}</b><span>전체 회원(예시)</span><br><span class="up">▲ 신규 가입 꾸준(예시)</span></a><a href="#c-tree"><b class="num">${actP}%</b><span>활동 중인 지부</span><br><span class="${actP>=60?"up":"dn"}">${act}/${BR.length}곳이 90점 이상</span></a><a href="#c-approve"><b class="num">${pend}</b><span>승인 대기</span><br><span>${APPS.filter(a=>a.stage===3).length}건은 중앙 확정 차례</span></a><a href="#c-log"><b class="num">${evM}</b><span>이번 달 행사</span><br><span>답변 대기 문의 ${inqOpen}건</span></a></div>
 <div class="two"><div class="stack"><div class="card lift"><h3 style="margin-bottom:2px">활동 지부 비율 추이</h3><p class="small mut" style="margin:0 0 8px">지난달까지는 예시 값, 이번 달은 현재 데이터</p>${svgLine(MONTHS,[38,41,45,47,52,58,actP],"%","월별 활동 지부 비율 꺾은선 그래프")}<h3 style="margin:18px 0 2px">월별 가입 신청</h3><p class="small mut" style="margin:0 0 8px">이번 달은 현재 접수 건수</p>${svgBars(MONTHS,[18,22,25,31,29,38,APPS.length],"","월별 가입 신청 막대 그래프")}</div>
 <div class="card lift"><h3 style="margin-bottom:6px">주의가 필요한 지부</h3>${warn.length?`<ul class="list">${warn.map(x=>`<li><span><b>${esc(x.b.nm)}</b> <span class="small mut">${esc(x.b.s)}</span><br><span class="small mut">${x.why.join(" · ")}</span></span><button class="btn sm line" data-act="node" data-id="${x.b.id}">살펴보기</button></li>`).join("")}</ul>`:`<p class="mut" style="margin:0">지금은 주의가 필요한 지부가 없습니다.</p>`}</div></div>
 <div class="stack"><div class="card lift"><h3 style="margin-bottom:10px">시·도별 활동</h3><div class="heat">${heat}</div><div class="legend2"><span><i style="background:var(--brand-soft)"></i>없음</span><span><i style="background:var(--t1)"></i>1</span><span><i style="background:var(--t2)"></i>2</span><span><i style="background:var(--t3)"></i>3</span><span><i style="background:var(--t4)"></i>4단계</span></div></div>
 <div class="card lift"><h3 style="margin-bottom:10px">가입 승인 흐름</h3><div class="funnel">${stg.map(s=>`<div class="fr"><span>${s[0]}</span><div class="fb"><i style="width:${Math.round(s[1]/mx*100)}%"></i></div><b class="num">${s[1]}</b></div>`).join("")}</div><p class="small mut" style="margin:10px 0 0">단계마다 줄어드는 곳이 병목입니다. 3일 넘게 머무는 신청은 자동화 규칙으로 알립니다.</p></div>
 <div class="card lift"><h3 style="margin-bottom:6px">최근 활동 기록</h3>${auditList(5)}</div></div></div>`)}

buildNav();
let start="home";try{start=location.hash.slice(1)||"home";if(start==="main")start="home"}catch(e){}
go(start);
</script></body></html>
